<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Box Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">⌗</div>
    <div>
      <p class="eyebrow">MEDIA BOX</p>
      <h1>Grab the media you can see.</h1>
    </div>
    <p class="copy">Draw a rectangle over a page, review the images, GIFs, videos, or audio found there, and download them together.</p>
    <button id="start" type="button">Select an area</button>
    <p id="status" role="status">Press Esc at any time to cancel.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
